demo:
  baseUrl: https://encurtador-demo.example.com
  timeoutMs: 5000
  mode: recorded

overview:
  problem:
    pt: Redirecionamentos precisam responder em poucos milissegundos mesmo com picos de tráfego, e o banco não pode ser consultado a cada clique.
    en: Redirects must answer in a few milliseconds even under traffic spikes, and the database can't be hit on every click.
  solution:
    pt: Cache-aside no Redis com TTL, códigos Base62 a partir de um contador atômico (sem colisão), contagem de cliques assíncrona e cenários de carga em k6 versionados no repositório.
    en: Cache-aside in Redis with TTL, Base62 codes from an atomic counter (no collisions), asynchronous click counting and k6 load scenarios versioned in the repo.
  architecture:
    alt:
      pt: "A Minimal API lê do Redis e só consulta o PostgreSQL em cache miss; os cliques são contados em segundo plano."
      en: "The Minimal API reads from Redis and only queries PostgreSQL on a cache miss; clicks are counted in the background."
    columns:
      - - name: Minimal API
          variant: primary
          description: { pt: "GET /{code} → 302, POST /api/links", en: "GET /{code} → 302, POST /api/links" }
        - name: Redis
          description: { pt: "Cache-aside, TTL 24 h", en: "Cache-aside, 24 h TTL" }
        - name: PostgreSQL
          description: { pt: "Links e cliques agregados (só em cache miss)", en: "Links and aggregated clicks (cache miss only)" }
      - - name: Fila de cliques
          variant: dashed
          description:
            pt: "Cliques enfileirados e gravados em lote, fora do caminho do redirecionamento."
            en: "Clicks queued and written in batches, off the redirect path."
        - name: k6
          description: { pt: "Cenários de carga versionados no repositório", en: "Load scenarios versioned in the repo" }
  metrics:
    - label: { pt: Redirecionamento p95, en: Redirect p95 }
      value: "[X ms p95]"
    - label: { pt: Requisições por segundo (k6), en: Requests per second (k6) }
      value: "[X req/s]"
    - label: { pt: Taxa de acerto do cache, en: Cache hit ratio }
      value: "[X %]"

requests:
