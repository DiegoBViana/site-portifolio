snippets:
  - title: { pt: Redirecionamento com cache-aside, en: Redirect with cache-aside }
    file: src/Shortener.Api/Program.cs
    lang: csharp
    code: |
      app.MapGet("/{code}", async (string code, IDatabase redis, LinksDb db, IClickQueue clicks) =>
      {
          var target = await redis.StringGetAsync($"link:{code}");
          if (target.IsNullOrEmpty)
          {
              var link = await db.Links.AsNoTracking().FirstOrDefaultAsync(l => l.Code == code);
              if (link is null) return Results.NotFound();
              target = link.TargetUrl;
              await redis.StringSetAsync($"link:{code}", target, TimeSpan.FromHours(24));
          }

          clicks.Enqueue(code); // contabilizado em background, fora do caminho crítico
          return Results.Redirect(target!, permanent: false);
      });
  - title: { pt: Cenário de carga (k6), en: Load scenario (k6) }
    file: load/redirect.js
    lang: javascript
    code: |
      import http from 'k6/http';
      import { check } from 'k6';

      export const options = {
        scenarios: {
          redirects: { executor: 'constant-arrival-rate', rate: 2000, timeUnit: '1s',
                       duration: '2m', preAllocatedVUs: 200 },
        },
        thresholds: { http_req_duration: ['p(95)<20'], http_req_failed: ['rate<0.001'] },
      };

      export default function () {
        const res = http.get(`${__ENV.BASE_URL}/aZ3k9Q`, { redirects: 0 });
        check(res, { 'is 302': (r) => r.status === 302 });
      }

