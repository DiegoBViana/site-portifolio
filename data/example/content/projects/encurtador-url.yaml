      latencyMs: 18
      body:
        code: "aZ3k9Q"
        shortUrl: "https://encurtador-demo.example.com/aZ3k9Q"
        targetUrl: "https://learn.microsoft.com/dotnet/core/whats-new/"
        expiresAt: "2025-04-13T13:40:00Z"
