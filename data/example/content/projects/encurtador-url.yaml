    name: { pt: Encurtar URL, en: Shorten URL }
    description:
      pt: Gera um código curto para a URL enviada.
      en: Generates a short code for the given URL.
    method: POST
    path: /api/links
    headers:
      Content-Type: application/json
    body: |
      { "url": "https://learn.microsoft.com/dotnet/core/whats-new/", "expiresInDays": 30 }
    sample:
