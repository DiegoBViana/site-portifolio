order: 3
featured: true
title:
  pt: Encurtador de URL de alto volume
  en: High-volume URL shortener
summary:
  pt: Minimal APIs com cache Redis na frente do banco, geração de códigos sem colisão e testes de carga com k6.
  en: Minimal APIs with a Redis cache in front of the database, collision-free code generation and k6 load tests.
stack: [Minimal APIs, Redis, k6, Docker, PostgreSQL]
# Exemplo de repositório privado: sem link, o painel mostra "Repositório privado".
privateRepo: true
card:
  thumbnail:
    svg: encurtador-url.svg
    alt:
      pt: "Diagrama: GET /abc12 consulta o Redis; no acerto responde 302 para o destino, na falta consulta o banco"
      en: "Diagram: GET /abc12 checks Redis; on a hit it answers 302 to the target, on a miss it reads the database"
  problem:
    pt: redirecionar links sob carga alta com latência baixa e previsível, sem bater no banco a cada clique.
    en: redirect links under heavy load with low, predictable latency, without hitting the database on every click.
