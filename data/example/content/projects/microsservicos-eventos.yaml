title:
  pt: Microsserviços orientados a eventos
  en: Event-driven microservices
summary:
  pt: Pedidos, Estoque e Notificações conversando por eventos com RabbitMQ + MassTransit, Outbox transacional e rastreamento distribuído com OpenTelemetry.
  en: Orders, Inventory and Notifications talking through events with RabbitMQ + MassTransit, a transactional Outbox and distributed tracing with OpenTelemetry.
stack: [RabbitMQ, MassTransit, Outbox, OpenTelemetry, .NET Aspire, PostgreSQL]
