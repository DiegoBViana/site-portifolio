overview:
  problem:
    pt: Quando o banco confirmava o pedido mas a publicação do evento falhava, o estoque ficava inconsistente — e ninguém conseguia seguir uma requisição entre serviços.
    en: When the database committed an order but publishing the event failed, inventory became inconsistent — and nobody could follow a request across services.
  solution:
    pt: Outbox transacional do MassTransit (evento salvo na mesma transação do pedido), consumidores idempotentes, retry com backoff + fila de erro, e traces OpenTelemetry propagados pelo RabbitMQ.
    en: MassTransit transactional Outbox (event saved in the same transaction as the order), idempotent consumers, retry with backoff + error queue, and OpenTelemetry traces propagated through RabbitMQ.
  architecture:
    alt:
      pt: "O serviço de Pedidos grava o pedido e o evento na Outbox; o MassTransit publica no RabbitMQ; Estoque e Notificações consomem; todos enviam traces ao OpenTelemetry."
      en: "The Orders service stores the order and the event in the Outbox; MassTransit publishes to RabbitMQ; Inventory and Notifications consume; all send traces to OpenTelemetry."
    columns:
      - - name: Pedidos.Api
          variant: primary
          description: { pt: "Grava pedido + evento na mesma transação (Outbox)", en: "Stores order + event in one transaction (Outbox)" }
        - name: RabbitMQ
          description: { pt: "MassTransit publica após o commit; retry + fila de erro", en: "MassTransit publishes after commit; retry + error queue" }
        - name: Estoque · Notificações
          description: { pt: "Consumidores idempotentes", en: "Idempotent consumers" }
      - - name: OpenTelemetry
          variant: dashed
          description:
            pt: "Traces propagados pelas mensagens; um pedido vira um único trace entre os três serviços."
            en: "Traces propagated through messages; one order becomes a single trace across the three services."
        - name: Jaeger · .NET Aspire
  metrics:
    - label: { pt: Vazão sustentada, en: Sustained throughput }
      value: "[X msg/s]"
    - label: { pt: Latência ponta a ponta p95, en: End-to-end p95 latency }
      value: "[X ms p95]"
    - label: { pt: Eventos perdidos em teste de falha, en: Events lost in failure test }
      value: "[N]"

