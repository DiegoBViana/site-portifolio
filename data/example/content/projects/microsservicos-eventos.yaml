snippets:
  - title: { pt: Outbox transacional com MassTransit, en: Transactional Outbox with MassTransit }
    file: src/Orders.Service/Program.cs
    lang: csharp
    code: |
      builder.Services.AddMassTransit(x =>
      {
          x.AddEntityFrameworkOutbox<OrdersDbContext>(o =>
          {
              o.UsePostgres();
              o.UseBusOutbox();          // evento só sai depois do commit
              o.QueryDelay = TimeSpan.FromSeconds(1);
          });

          x.AddConsumer<PaymentConfirmedConsumer>();

          x.UsingRabbitMq((ctx, cfg) =>
          {
              cfg.Host(builder.Configuration.GetConnectionString("RabbitMq"));
              cfg.UseMessageRetry(r => r.Exponential(5,
                  TimeSpan.FromMilliseconds(200), TimeSpan.FromSeconds(10),
                  TimeSpan.FromMilliseconds(200)));
              cfg.ConfigureEndpoints(ctx);
          });
      });
  - title: { pt: Consumidor idempotente, en: Idempotent consumer }
    file: src/Inventory.Service/Consumers/OrderSubmittedConsumer.cs
    lang: csharp
    code: |
      public sealed class OrderSubmittedConsumer(InventoryDbContext db) : IConsumer<OrderSubmitted>
      {
          public async Task Consume(ConsumeContext<OrderSubmitted> context)
          {
              var msg = context.Message;
              if (await db.ProcessedMessages.AnyAsync(p => p.MessageId == context.MessageId))
                  return; // já processado: entrega "at-least-once" sem efeito duplicado

              foreach (var item in msg.Items)
                  await db.Stock.ReserveAsync(item.Sku, item.Quantity);

              db.ProcessedMessages.Add(new(context.MessageId!.Value));
              await db.SaveChangesAsync();
              await context.Publish(new StockReserved(msg.OrderId));
          }
      }

